<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Administrator Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background: #f4f6f9;
        }

        .login-container {
            width: 100%;
            max-width: 400px;

            background: white;

            padding: 35px;

            border-radius: 10px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.10);
        }

        .login-container h1 {
            text-align: center;

            margin-top: 0;
            margin-bottom: 10px;
        }

        .login-subtitle {
            text-align: center;

            color: #666;

            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        .form-group input {
            width: 100%;

            padding: 11px;

            border: 1px solid #ccc;

            border-radius: 5px;

            font-size: 15px;
        }

        .form-group input:focus {
            outline: none;

            border-color: #2563eb;
        }

        .login-button {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 5px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .error-message {
            background: #fee2e2;

            color: #991b1b;

            padding: 10px;

            border-radius: 5px;

            margin-bottom: 20px;
        }

        .back-to-store {
            text-align: center;

            margin-top: 20px;
        }

        .back-to-store a {
            color: #2563eb;

            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="login-container">

    <h1>Admin Login</h1>

    <p class="login-subtitle">
        E-Commerce Administration
    </p>


    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="error-message">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST"
          action="{{ url_for('admin_auth.login') }}">


        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required>

        </div>


        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required>

        </div>


        <button
            type="submit"
            class="login-button">

            Login

        </button>

    </form>


    <div class="back-to-store">

        <a href="{{ url_for('storefront.home') }}">
            ← Back to Store
        </a>

    </div>

</div>


</body>

</html>
