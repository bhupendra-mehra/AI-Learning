services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce-db:local
    container_name: ecommerce-db-app
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"
    restart: unless-stopped