{% extends "admin/base_admin.html" %}

{% block content %}
<h2>
    {{ "Edit Product" if product else "Add Product" }}
</h2>
<div class="admin-card">
    <form class="admin-form" method="POST" action="{{
          url_for('admin_products.edit_product', product_id=product.id)
          if product else url_for('admin_products.create_product')
      }}">

        <div class="form-group">
            <label for="name">Product Name</label>
            <input type="text" id="name" name="name"
                value="{{ request.form.get('name', product.name if product else '') }}" required>
        </div>

        <div class="form-group">
            <label for="sku">SKU</label>
            <input  type="text" id="sku" name="sku" value="{{ request.form.get('sku', product.sku if product else '') }}" required>
        </div>

        <div class="form-group">
            <label for="price">Price</label>
            <input type="number" id="price" name="price" min="0" step="0.01"
                value="{{ request.form.get('price', product.price if product else '') }}" required>
        </div>

        <div class="form-group">
            <label for="stock">Quantity</label>
            <input type="number" id="quantity" name="quantity" min="0" step="1"
                value="{{ request.form.get('quantity', product.quantity if product else '') }}" required>
        </div>

        <div class="form-group">
            <label for="product_id">Category</label>
            <select id="category_id" name="category_id" required>
                <option value="">Select Category</option>
                {% for category in categories %}
                <option value="{{ category.id }}" {% if category and category.id==product.category_id %} selected {%
                    endif %}>
                    {{ category.name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions">
            <button type="submit"  class="btn btn-primary">
                {{ "Update Product" if product else "Create Product" }}
            </button>

            <a href="{{ url_for('admin_products.list_products') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
